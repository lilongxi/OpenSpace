specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
# 这里定义数据源 需要具体的合约地址 从固定地址获取数据
dataSources:
  - kind: ethereum
    name: nftfactorygraph
    network: sepolia
    source:
      address: "0x9e72881669c7b39d4283B3ce11922C248B2c5755"
      abi: nftfactorygraph
      startBlock: 6976618
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NFTCreated
        - NFTRegesitered
        - OwnershipTransferred
        - TokenInfo
      abis:
        - name: nftfactorygraph
          file: ./abis/nftfactorygraph.json
      eventHandlers:
        - event: NFTCreated(address)
          handler: handleNFTCreated
        - event: NFTRegesitered(address)
          handler: handleNFTRegesitered
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/nftfactorygraph.ts
# 定义实例 是数据源的具体化对象 
templates:
  - kind: ethereum/contract
    name: NFTContract
    network: sepolia
    source:
      abi: nft
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenInfo
      abis:
        - name: nft
          file: ./abis/nft.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/nftcontract.ts